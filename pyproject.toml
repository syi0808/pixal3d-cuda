[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixal3d-cuda"
version = "0.2.0"
description = "Source-pinned official Pixal3D CUDA runtime and deployment adapters"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<2.11",
    "numpy>=1.26,<3",
    "pillow>=10",
    "huggingface-hub>=0.28,<2",
    "psutil>=6",
]

[project.optional-dependencies]
camera = ["moge @ git+https://github.com/microsoft/MoGe.git@b942f00bdc2a2a23ebb474fbe034d487e6dcceec"]
dev = ["pytest>=8", "nbformat>=5.10", "httpx>=0.28,<1", "trimesh>=4.6,<5", "safetensors>=0.5", "opencv-python-headless==4.12.0.88"]
modal = ["modal>=1.6.4,<2"]
server = ["fastapi>=0.162.4,<1", "pydantic>=2,<3", "python-multipart>=0.0.20"]
upstream = [
    "trimesh==4.10.1", "pillow==12.0.0", "safetensors>=0.5",
    "torchvision==0.21.0", "transformers==4.57.3", "easydict==1.13", "opencv-python-headless==4.12.0.88",
    "imageio==2.37.2", "imageio-ffmpeg==0.6.0", "tqdm==4.67.1", "zstandard==0.25.0",
    "kornia==0.8.2", "timm==1.0.22", "diffusers==0.37.1", "accelerate==1.13.0", "plyfile==1.1.3",
    "ninja", "wheel", "setuptools", "einops", "cmake==3.31.6",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
]

[project.scripts]
pixal3d-cuda = "pixalcuda.cli:main"

[tool.setuptools.packages.find]
include = ["pixalcuda*"]

[tool.setuptools.package-data]
pixalcuda = ["upstream-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
