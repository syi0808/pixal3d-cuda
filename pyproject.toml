[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixal3d-cuda"
version = "0.1.1"
description = "Memory-bounded Pixal3D 512 inference for NVIDIA T4 and Colab"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<2.11",
    "numpy>=1.26,<3",
    "pillow>=10",
    "safetensors>=0.5",
    "huggingface-hub>=0.28,<2",
    "scipy>=1.12",
    "trimesh>=4.6,<5",
    "xatlas>=0.0.9",
    "fast-simplification>=0.1.9",
    "psutil>=6",
]

[project.optional-dependencies]
preprocess = ["rembg[cpu]>=2.0.60"]
camera = ["moge @ git+https://github.com/microsoft/MoGe.git@b942f00bdc2a2a23ebb474fbe034d487e6dcceec"]
dev = ["pytest>=8", "nbformat>=5.10"]
modal = ["modal>=1.6.4,<2"]

[project.scripts]
pixal3d-cuda = "pixalcuda.cli:main"

[tool.setuptools.packages.find]
include = ["pixalcuda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
