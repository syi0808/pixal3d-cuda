environment = "main"
app_name = "pixal3d-cuda"
weights_volume = "pixal3d-weights"
jobs_volume = "pixal3d-jobs"
jobs_dict = "pixal3d-jobs"
hf_secret = "pixal3d-hf"
gpu = "L4"
min_containers = 0
max_gpu_containers = 1
scaledown_window = 2
cpu_cores = 2.0
gpu_cpu_cores = 8.0
cpu_memory_mib = [4096, 16384]
gpu_memory_mib = [16384, 65536]
prefetch_memory_mib = [2048, 8192]
gpu_timeout_seconds = 1800
cpu_timeout_seconds = 1800
prefetch_timeout_seconds = 3600
max_views = 16
max_upload_bytes = 16777216
max_total_image_bytes = 67108864
max_transforms_bytes = 65536
max_image_pixels = 16000000
api_memory_mib = [1024, 4096]
api_max_jobs_per_day = 10
low_vram = true
attention_backend = "sdpa"
max_tokens = 49152
share_dino = true
dino_cache_mb = 128
sparse_projection = true
conditioning_cache_mb = 256
save_reference = false
allow_rmbg = false
skip_weight_init = true
inpaint_workers = 4
