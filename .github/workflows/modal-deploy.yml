name: Deploy Modal manually

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing Modal and GitHub environment
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read

concurrency:
  group: modal-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      MODAL_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,modal]'
      - name: Run local contracts
        run: python -m pytest -q
      - name: Print local infrastructure declarations
        run: python -m deploy.modal_app --action plan
      - name: Deploy declarations without running inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          modal deploy -m deploy.modal_app
