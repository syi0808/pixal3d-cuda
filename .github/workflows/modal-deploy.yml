name: Deploy Modal manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TencentARC/Pixal3D
          ref: f7cf38429b0bd264f1995f0f8743a88b1c728b94
          path: outputs/upstream-Pixal3D-review
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,modal,server]'
      - name: Run local contracts
        run: python -m pytest -q
      - name: Print local infrastructure declarations
        run: python -m deploy.modal_app --action plan
      - name: Deploy declarations without running inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          modal deploy --env main -m deploy.modal_app
